    #     databricks-token: ${{ env.DATABRICKS_TOKEN_DEV }}
    #     local-notebook-path: d_notebook.sql
    #     workspace-temp-dir: /SP-Power-BI-Development/tmp
    #     new-cluster-json: ${{ env.CLUSTER_PARAMS }}
    #     access-control-list-json: ${{ env.ACCESS_LIST }}
    
    ############################################################## TEST ##############################################################
    # - name: Get Test Databricks Token
    #   run: 
    #     echo ${{ format(env.TOKEN_URL, 'TEST', secrets.TENENT_ID, secrets.TEST_AZURE_SP_ID, secrets.TEST_AZURE_SP_SECRET) }} >> $GITHUB_ENV
    
    # - name: Run Notebook on Test
    #   uses: databricks/run-notebook@f381bd756ae171a8f5a55b8dc5d5d760ef914daf
    #   with:
    #     databricks-host: https://adb-3428170089966232.12.azuredatabricks.net/
    #     databricks-token: ${{ env.DATABRICKS_TOKEN_TEST }}
    #     local-notebook-path: t_notebook.sql
    #     workspace-temp-dir: /SP-Power-BI-Development/tmp
    #     new-cluster-json: ${{ env.CLUSTER_PARAMS }}
    #     access-control-list-json: ${{ env.ACCESS_LIST }}
    
    ############################################################## PROD ##############################################################
    - name: Get Prod Databricks Token
      run: 
        echo ${{ format(env.TOKEN_URL, 'PROD', secrets.TENENT_ID, secrets.PROD_AZURE_SP_ID, secrets.PROD_AZURE_SP_SECRET) }} >> $GITHUB_ENV
    
    - name: Run Notebook on Prod
      uses: databricks/run-notebook@f381bd756ae171a8f5a55b8dc5d5d760ef914daf
      with:
        databricks-host: https://adb-2776823572857644.4.azuredatabricks.net/
        databricks-token: ${{ env.DATABRICKS_TOKEN_PROD }}
        local-notebook-path: p_notebook.sql
        workspace-temp-dir: /SP-Power-BI-Development/tmp
        new-cluster-json: ${{ env.CLUSTER_PARAMS }}
        access-control-list-json: ${{ env.ACCESS_LIST }}


  handle_added_modified:
    if: always() && ( needs.find_changes.outputs.changed_notebooks != '[]' )
    runs-on: ubuntu-latest
    needs: [find_changes, handle_deleted]
    strategy:
      matrix:
        notebook_path: ${{fromJson(needs.find_changes.outputs.changed_notebooks)}}
    
    steps:
    - uses: actions/checkout@v4
    - name: Prepare temp notebooks
      run: |
        python ./scripts/notebook/notebook_create_update.py "${{ matrix.notebook_path }}"

    ############################################################## DEV ###############################################################
    # - name: Get Dev Databricks Token
    #   run: 
    #     echo ${{ format(env.TOKEN_URL, 'DEV', secrets.TENENT_ID, secrets.DEV_AZURE_SP_ID, secrets.DEV_AZURE_SP_SECRET) }} >> $GITHUB_ENV
    
    # - name: Run Notebook on Dev
