    #     databricks-token: ${{ env.DATABRICKS_TOKEN_TEST }}
    #     local-notebook-path: t_notebook.sql
    #     workspace-temp-dir: /SP-Power-BI-Development/tmp
    #     new-cluster-json: ${{ env.CLUSTER_PARAMS }}
    #     access-control-list-json: ${{ env.ACCESS_LIST }}
    
    ############################################################## PROD ##############################################################
    - name: Get Prod Databricks Token
      run: 
        echo ${{ format(env.TOKEN_URL, 'PROD', secrets.TENENT_ID, secrets.PROD_AZURE_SP_ID, secrets.PROD_AZURE_SP_SECRET) }} >> $GITHUB_ENV
    
    - name: Run Notebook on Prod
      uses: databricks/run-notebook@f381bd756ae171a8f5a55b8dc5d5d760ef914daf
      with:
        databricks-host: https://adb-2776823572857644.4.azuredatabricks.net/
        databricks-token: ${{ env.DATABRICKS_TOKEN_PROD }}
        local-notebook-path: p_notebook.sql
        workspace-temp-dir: /SP-Power-BI-Development/tmp
        new-cluster-json: ${{ env.CLUSTER_PARAMS }}
        access-control-list-json: ${{ env.ACCESS_LIST }}
